<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extruder Entry</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  body{ padding:22px; }
  .container{ max-width:560px; margin:0 auto; }
  #status{ text-align:center; font-size:13px; font-weight:700; }
  .warning{ color:var(--bad); font-size:12.5px; margin-top:6px; font-weight:600; min-height:14px; }
  .msg{ text-align:center; margin-top:12px; font-weight:700; }
</style>
<script>
  (function(){
    function apply(t){ if(t) document.documentElement.setAttribute("data-theme", t); }
    window.addEventListener("message", function(e){ if(e.data && e.data.rumbuTheme) apply(e.data.rumbuTheme); });
    try{ apply(localStorage.getItem("rumbu_theme")); }catch(e){}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
</head>
<body>

<div class="container">

  <div id="statusBox" class="card-panel">
    <div id="status">Checking your session...</div>
  </div>

  <div id="formBox" class="card-panel" style="display:none;">
    <h2>Extruder Entry</h2>
    <p class="sub">Record an extruder production entry (A / B / C grades).</p>

    <div class="field"><label>Date</label><input type="date" id="date" required></div>

    <div class="form-row">
      <div class="field"><label>Section</label><select id="section" required></select></div>
      <div class="field"><label>Shift</label><select id="shift"><option value="Morning">Morning</option><option value="Night">Night</option></select></div>
    </div>

    <div class="form-row">
      <div class="field"><label>Extruder Name</label><select id="name"></select></div>
      <div class="field"><label>Type</label><select id="type"></select></div>
    </div>
    <div id="typeWarning" class="warning"></div>

    <div class="field"><label>Number of Machine</label><input type="text" id="machine"></div>

    <div class="form-row-3">
      <div class="field"><label>A</label><input type="number" step="0.01" id="a"></div>
      <div class="field"><label>B</label><input type="number" step="0.01" id="b"></div>
      <div class="field"><label>C</label><input type="number" step="0.01" id="c"></div>
    </div>

    <div class="field"><label>Total</label><input type="number" id="total" readonly></div>

    <button id="submitBtn" onclick="submitForm()">Submit</button>
    <div class="msg" id="msg"></div>
  </div>

</div>

<script>
function authHeaders(){ return { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" }; }

// Map internal section names to the display names used on this form.
const SECTION_DISPLAY_MAP = { "Rumbu":"Rumbu", "MamaSannu":"Mama Sannu" };

const extrudersRumbu = ["Extruder 1","Extruder 2","Extruder 3","Extruder 4","Extruder 5"];
const extruderMama   = ["Extruder MamaSannu"];
const typesAll       = ["No.1","No.2","No.3","No.4","PMat"];

let sectionEl, nameEl, typeEl, warningEl;

async function init(){
  const statusBox = document.getElementById("statusBox");
  const me = await requireAuth("../../login.html");
  if(!me) return;

  sectionEl = document.getElementById("section");
  nameEl    = document.getElementById("name");
  typeEl    = document.getElementById("type");
  warningEl = document.getElementById("typeWarning");

  // Sections come from the user's Manage Account assignment.
  const mySections = (me.sectionNames && me.sectionNames.length)
    ? me.sectionNames.map(s => SECTION_DISPLAY_MAP[s] || s).filter(s => s === "Rumbu" || s === "Mama Sannu")
    : [];
  const opts = mySections.length ? mySections : ["Rumbu","Mama Sannu"];

  sectionEl.innerHTML = (opts.length > 1 ? '<option value="">Select</option>' : "")
    + opts.map(s=>`<option value="${s}">${s}</option>`).join("");
  if(opts.length === 1){ sectionEl.value = opts[0]; }

  sectionEl.addEventListener("change", updateOptions);
  typeEl.addEventListener("change", checkRules);
  ["a","b","c"].forEach(id=>document.getElementById(id).addEventListener("input", calculateTotal));

  updateOptions();
  setDateLimit();

  statusBox.style.display = "none";
  document.getElementById("formBox").style.display = "block";
}

function setDateLimit(){
  const d = document.getElementById("date");
  const today = new Date();
  d.max = today.toISOString().split("T")[0];
}

function updateOptions(){
  const section = sectionEl.value;
  nameEl.innerHTML = "";
  typeEl.innerHTML = "";
  warningEl.innerText = "";

  if(section === "Mama Sannu"){
    extruderMama.forEach(e => nameEl.add(new Option(e, e)));
    typeEl.add(new Option("No.1","No.1"));   // Mama Sannu only uses No.1
  } else if(section === "Rumbu"){
    extrudersRumbu.forEach(e => nameEl.add(new Option(e, e)));
    typesAll.forEach(t => typeEl.add(new Option(t, t)));
  }
}

// Advisory warnings (never block) — same rules as before.
function checkRules(){
  const section = sectionEl.value;
  const extruder = nameEl.value;
  const type = typeEl.value;
  warningEl.innerText = "";
  if(section !== "Rumbu") return;

  if(extruder === "Extruder 1" || extruder === "Extruder 5"){
    if(type !== "No.1") warningEl.innerText = "⚠️ Only No.1 is normally used for this extruder.";
  }
  if(extruder === "Extruder 2" || extruder === "Extruder 3" || extruder === "Extruder 4"){
    if(type === "No.1") warningEl.innerText = "⚠️ No.1 is not usual for this extruder.";
  }
}

function calculateTotal(){
  const a = parseFloat(document.getElementById("a").value) || 0;
  const b = parseFloat(document.getElementById("b").value) || 0;
  const c = parseFloat(document.getElementById("c").value) || 0;
  document.getElementById("total").value = a + b + c;
}

async function submitForm(){
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("msg");

  const data = {
    date_col: document.getElementById("date").value,
    section: sectionEl.value,
    shift: document.getElementById("shift").value,
    type_col: typeEl.value,
    number_of_machine: document.getElementById("machine").value,
    extruder_name: nameEl.value,
    a: parseFloat(document.getElementById("a").value) || 0,
    b: parseFloat(document.getElementById("b").value) || 0,
    c: parseFloat(document.getElementById("c").value) || 0,
    total: parseFloat(document.getElementById("total").value) || 0
  };

  if(!data.date_col || !data.section || !data.shift || !data.extruder_name || !data.type_col){
    msg.style.color = "var(--bad)";
    msg.innerText = "Please fill Date, Section, Shift, Extruder and Type.";
    return;
  }

  btn.disabled = true; btn.innerText = "Submitting...";
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/extruder_new", {
      method: "POST", headers: authHeaders(), body: JSON.stringify(data)
    });
    if(!res.ok) throw new Error("HTTP " + res.status + " - " + await res.text());

    msg.style.color = "var(--ok)";
    msg.innerText = "✅ Saved successfully";
    ["machine","a","b","c","total"].forEach(id=>document.getElementById(id).value="");
    warningEl.innerText = "";
  }catch(e){
    msg.style.color = "var(--bad)";
    msg.innerText = "❌ " + (e.message || e);
  }finally{
    btn.disabled = false; btn.innerText = "Submit";
  }
}

init();
</script>
</body>
</html>
