<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Approval — Logistics</title>
<link rel="stylesheet" href="../../styles.css">
<script>
  (function(){ try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("rumbu_theme")||"navy"); }catch(e){} })();
  window.addEventListener("message",function(e){ if(e.data&&e.data.rumbuTheme) document.documentElement.setAttribute("data-theme",e.data.rumbuTheme); });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../auth.js"></script>
<script src="review-modal.js"></script>
<style>
  body{padding:18px;}
  .wrap{max-width:900px;margin:0 auto;}
  .approve-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <button onclick="(window.parent&&window.parent.closeModule)?window.parent.closeModule():(window.location.href='../../index.html')" style="max-width:200px;margin-bottom:12px;background:var(--accent);color:var(--logo-fg);">&larr; Back</button>
  <div id="connStatus" style="font-size:12px;font-weight:700;text-align:center;margin-bottom:10px;color:var(--muted);">Loading...</div>

  <div class="card-panel">
    <h3 style="color:var(--heading);margin:0 0 4px;">Trip Approval Queue</h3>
    <p style="font-size:12px;color:var(--muted);margin:0 0 16px;">Review the full request before approving or rejecting — ALL assigned approvers must approve.</p>
    <div id="queue"></div>
  </div>
</div>

<script>
let ME = null;
let Q_DATA = [];

async function init(){
  const status = document.getElementById("connStatus");
  try{
    ME = await requireAuth("../../login.html");
    if(!ME) return;
    await loadQueue();
    status.style.color="var(--ok)"; status.textContent="Connected.";
  }catch(e){
    status.style.color="var(--bad)"; status.textContent="Error: "+e.message;
  }
}

async function loadQueue(){
  const { data, error } = await sb.from("logistics_trips")
    .select("*, logistics_vehicles(registration_number,operational_status), logistics_drivers(employees(full_name,employee_id))")
    .eq("status","submitted").order("created_at",{ascending:false});
  const wrap = document.getElementById("queue");
  if(error){ wrap.innerHTML = "Error: " + error.message; return; }
  if(!data || !data.length){ wrap.innerHTML = "<p style='color:var(--muted);font-size:13px;'>No trip requests awaiting approval.</p>"; return; }

  const { data: myDec } = await sb.from("logistics_trip_approvals").select("trip_id,cycle").eq("approver_profile_id", ME.id);
  const decided = new Set((myDec||[]).map(d=>d.trip_id+":"+d.cycle));

  Q_DATA = data;
  wrap.innerHTML = data.map(t=>{
    const veh = t.logistics_vehicles ? t.logistics_vehicles.registration_number : "—";
    const drv = (t.logistics_drivers && t.logistics_drivers.employees) ? t.logistics_drivers.employees.full_name : "—";
    const hasDec = decided.has(t.id+":"+(t.cycle||1));
    return `<div class="approve-card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div><b>${t.destination}</b> — ${t.requesting_department}
          <div style="font-size:12px;color:var(--muted);">${t.trip_date} | Vehicle: ${veh} | Driver: ${drv}</div>
        </div>
        ${hasDec ? `<span style="color:var(--ok);font-size:12px;font-weight:700;">Decision submitted — awaiting others</span>` : ""}
      </div>
      ${!hasDec ? `<div style="margin-top:10px;"><button onclick="openReview(${t.id})">Review to Confirm or Reject</button></div>` : ""}
    </div>`;
  }).join("");
}

function openReview(tripId){
  const t = Q_DATA.find(x=>x.id===tripId);
  if(!t) return;
  const veh = t.logistics_vehicles || {};
  const drvE = (t.logistics_drivers && t.logistics_drivers.employees) ? t.logistics_drivers.employees : {};
  showReviewModal({
    title: "Trip Request — Review Submission",
    subtitle: t.destination + " — " + t.trip_date,
    mode: "decide",
    sections: [
      { rows: [
        ["Requesting Department", t.requesting_department],
        ["Destination", t.destination],
        ["Purpose", t.purpose],
        ["Trip Date", t.trip_date],
        ["Expected Duration (days)", t.expected_duration_days],
        ["Vehicle", veh.registration_number + (veh.operational_status ? " (" + veh.operational_status + ")" : "")],
        ["Driver", (drvE.full_name||"—") + (drvE.employee_id ? " (" + drvE.employee_id + ")" : "")],
        ["Supporting Document", reviewModalFileLink(t.supporting_document, "View attachment")],
      ]}
    ],
    onApprove: ()=>decide(tripId,'approved',null),
    onReject: (note)=>decide(tripId,'rejected',note)
  });
}

async function decide(tripId, decision, note){
  const t = Q_DATA.find(x=>x.id===tripId);
  const cycle = t ? (t.cycle||1) : 1;
  try{
    const { error: apprErr } = await sb.from("logistics_trip_approvals").insert({
      trip_id: tripId, cycle, approver_profile_id: ME.id, decision, note
    });
    if(apprErr) throw apprErr;

    let allApproved = ME.role === "super_admin";
    if(!allApproved){
      const { data: approvers } = await sb.from("logistics_trip_approvers").select("profile_id");
      if(!approvers || !approvers.length){
        allApproved = true;
      } else {
        const { data: decisions } = await sb.from("logistics_trip_approvals")
          .select("approver_profile_id,decision").eq("trip_id", tripId).eq("cycle", cycle);
        const approvedIds = new Set((decisions||[]).filter(d=>d.decision==="approved").map(d=>d.approver_profile_id));
        allApproved = approvers.every(a=>approvedIds.has(a.profile_id));
      }
    }

    if(decision === "rejected"){
      await sb.from("logistics_trips").update({ status:"rejected" }).eq("id", tripId);
    } else if(allApproved){
      await sb.from("logistics_trips").update({ status:"approved" }).eq("id", tripId);
    }

    await sb.from("logistics_activity_log").insert({
      entity_type:"trip", entity_id:tripId, action:"trip_"+decision,
      actor_profile_id: ME.id, actor_username: ME.username,
      description: ME.username + " " + decision + " trip request to " + (t?t.destination:"") + (note?(" — "+note):"")
    });

    await loadQueue();
  }catch(e){
    alert("❌ " + e.message);
  }
}

init();
</script>
</body>
</html>
